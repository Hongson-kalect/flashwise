plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.inkrecognition'
version = '0.1.0'

android {
  namespace "expo.modules.inkrecognition"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Nhận dạng nét viết tay trên máy (model tải 1 lần cho mỗi ngôn ngữ)
  implementation 'com.google.mlkit:digital-ink-recognition:18.1.0'
}
